name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ToriumBot IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Package Companion Tweak Deb
        run: |
          python3 package_deb.py

      - name: Build Watchdog Daemon Binary
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation -o ToriumBot/Resources/watchdog_daemon \
            ToriumBot/Daemon/watchdog_daemon.c || true

      - name: Build and Archive
        run: |
          xcodebuild -project ToriumBot/ToriumBot.xcodeproj \
            -scheme ToriumBot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToriumBot.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for TrollStore
        run: |
          mkdir -p dist/Payload
          cp -r build/ToriumBot.xcarchive/Products/Applications/ToriumBot.app dist/Payload/
          cp ToriumBot/Resources/toriumhelper.deb dist/Payload/ToriumBot.app/ 2>/dev/null || true
          cp ToriumBot/Resources/watchdog_daemon dist/Payload/ToriumBot.app/ 2>/dev/null || true
          cp ToriumBot/Daemon/install_daemon.sh dist/Payload/ToriumBot.app/ 2>/dev/null || true
          cp ToriumBot/Daemon/com.toriumbot.watchdog.plist dist/Payload/ToriumBot.app/ 2>/dev/null || true
          cd dist
          zip -r ToriumBot.ipa Payload
          ls -lh ToriumBot.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToriumBot-TrollStore-IPA
          path: dist/ToriumBot.ipa
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ToriumBot.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
